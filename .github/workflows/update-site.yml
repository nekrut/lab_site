name: Monthly site update

on:
  schedule:
    - cron: "17 6 1 * *"   # 06:17 UTC on the 1st of every month
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v5

      - name: Checkout CV (private, curated source of truth)
        uses: actions/checkout@v5
        with:
          repository: nekrut/CV
          token: ${{ secrets.CV_REPO_TOKEN }}
          path: cv

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright (KUI dashboard scrape)
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Refresh usegalaxy KUI stats
        id: kui
        continue-on-error: true
        run: python scripts/fetch_kui_stats.py

      - name: Build site (CV people/grants + live iCite citations)
        env:
          CV_MD: cv/vitae.md
        run: python scripts/build_site.py

      - name: Check external links
        id: links
        continue-on-error: true
        run: python scripts/check_links.py | tee link_report.md

      - name: Discover new PubMed records not in CV
        id: pubs
        continue-on-error: true
        env:
          CV_MD: cv/vitae.md
        run: python scripts/discover_pubs.py | tee pubs_report.md

      - name: Commit and deploy
        run: |
          git config user.name "lab-site-bot"
          git config user.email "actions@github.com"
          git add docs scripts/data
          if git diff --cached --quiet; then
            echo "No changes this month."
          else
            git commit -m "Monthly auto-update: iCite citations, KUI stats, rebuild ($(date +%Y-%m))"
            git push
          fi

      - name: File maintenance issue if anything needs a human
        if: steps.links.outcome == 'failure' || steps.pubs.outcome == 'failure' || steps.kui.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Monthly update ran on $(date -u +%F). Items needing review:"
            echo
            if [ "${{ steps.kui.outcome }}" = "failure" ]; then
              echo "## KUI stats scrape failed — dashboard numbers are stale"
              echo
            fi
            if [ "${{ steps.pubs.outcome }}" = "failure" ]; then
              cat pubs_report.md; echo
            fi
            if [ "${{ steps.links.outcome }}" = "failure" ]; then
              cat link_report.md; echo
            fi
          } > issue_body.md
          existing=$(gh issue list --label site-maintenance --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file issue_body.md
          else
            gh issue create --title "Site maintenance: $(date -u +%Y-%m)" \
              --label site-maintenance --body-file issue_body.md
          fi
